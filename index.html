    ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.5); border-radius: 20px; min-height: 30px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    body {
      background: linear-gradient(180deg, #06091a 0%, #03050e 55%, #03050e 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      position: relative;
    }

    /* BACKGROUND GLOWS */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      opacity: 0.12;
      pointer-events: none;
    }
    body::before {
      top: -10%; left: -10%; width: 500px; height: 500px;
      background: radial-gradient(circle, #00d4ff 0%, transparent 70%);
    }
    body::after {
      bottom: -10%; right: -10%; width: 400px; height: 400px;
      background: radial-gradient(circle, #003566 0%, transparent 70%);
    }

    .container {
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* --- HEADER --- */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 12px 0;
    }

    .back-btn, .how-to-btn {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .back-btn:hover, .how-to-btn:hover {
      background: var(--btn-gradient);
      color: #fff;
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    /* --- TOP CENTER BANNER --- */
    .top-image-container {
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .top-center-image {
      width: 100%;
      max-width: 380px;
      height: 55px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top-center-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* --- 1WIN SPECIAL BANNER --- */
    .special-1win-banner {
      width: 100%;
      max-width: 380px;
      padding: 10px 14px;
      margin: 0 auto 10px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.5;
      display: none;
      box-shadow: var(--shadow);
    }

    .special-1win-banner .highlight { color: var(--primary); font-weight: 700; }
    .special-1win-banner .code {
      background: rgba(0, 212, 255, 0.12);
      padding: 2px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      color: var(--primary);
      font-weight: 700;
    }

    /* --- TOP BAR --- */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .user-counter, .server-status {
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      transition: all 0.3s ease;
      color: var(--text-main);
      box-shadow: var(--shadow);
    }

    .user-counter:hover, .server-status:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .user-counter i, .server-status i { color: var(--primary); animation: pulse 2s infinite; }
    .user-counter span, .server-status span { color: var(--primary); font-weight: 700; }

    /* --- MOVING BANNER --- */
    .moving-register-banner {
      position: relative;
      width: 100%;
      overflow: hidden;
      height: 45px;
      margin: 8px 0 12px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }

    .moving-register-text {
      position: absolute;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      animation: scrollText 25s linear infinite;
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .moving-register-text i { color: var(--primary); font-size: 16px; }

    .moving-register-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      border: none;
      background: var(--btn-gradient);
      color: #fff;
      white-space: nowrap;
      margin-left: 10px;
      box-shadow: 0 4px 10px rgba(0, 212, 255, 0.3);
    }

    .moving-register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 212, 255, 0.4);
      background: var(--btn-hover);
    }

    @keyframes scrollText {
      0% { left: 100%; transform: translateX(0); }
      100% { left: 0; transform: translateX(-100%); }
    }

    /* --- GAME SELECTOR --- */
    .game-selector-container {
      width: 100%;
      margin: 0 auto 18px;
      position: relative;
    }

    /* Floating Tags - Blue Theme */
    .click-to-change-tag, .hot-tag, .info-hot-tag, .bonus-tag {
      background: var(--tag-bg);
      color: var(--primary);
      font-weight: 700;
      border: 1px solid rgba(0, 212, 255, 0.4);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
    }

    .click-to-change-tag {
      position: absolute;
      top: -10px;
      left: 14px;
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
      animation: floatTag 2s ease-in-out infinite;
    }

    .click-to-change-tag::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 18px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: rgba(0, 212, 255, 0.4) transparent transparent transparent;
    }

    @keyframes floatTag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .game-selector-btn {
      width: 100%;
      padding: 14px 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .game-selector-btn:hover { 
      background: var(--glass-hover); 
      transform: translateY(-2px);
      border-color: var(--border-highlight);
    }

    .selected-option { display: flex; align-items: center; gap: 12px; }
    .selected-option img {
      width: 32px; height: 32px; object-fit: contain; border-radius: 8px; 
      border: 2px solid var(--border);
    }

    .game-selector-dropdown {
      position: absolute; top: 100%; left: 0; width: 100%; max-height: 300px; overflow-y: auto;
      background: linear-gradient(145deg, #07101e, #030810);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px; margin-top: 8px; z-index: 100;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.12);
    }
    .game-selector-dropdown.show { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .game-selector-search {
      padding: 12px; position: sticky; top: 0; 
      background: linear-gradient(145deg, #07101e, #030810);
      backdrop-filter: blur(8px);
      z-index: 1; border-bottom: 1px solid var(--border);
    }
    .game-selector-search input {
      width: 100%; padding: 10px 12px; background: rgba(0, 212, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-main); font-size: 14px; font-weight: 500; outline: none;
    }
    .game-selector-search input:focus { border-color: var(--primary); }
    .game-selector-search input::placeholder { color: #3a6a88; }

    .game-selector-options { padding: 8px 0; }
    .game-option {
      padding: 10px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
      transition: all 0.3s ease; color: var(--text-main); position: relative; 
      border-bottom: 1px solid rgba(0, 212, 255, 0.08);
    }
    .game-option:last-child { border-bottom: none; }
    .game-option:hover { background: rgba(0, 212, 255, 0.07); }
    .game-option img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border); }
    .game-option.active { background: rgba(0, 212, 255, 0.12); border-left: 3px solid var(--primary); }

    .hot-tag {
      position: absolute; top: -8px; right: 10px; 
      font-size: 9px; padding: 3px 8px; border-radius: 12px;
    }

    /* --- SELECTED GAME INFO --- */
    .selected-game-info {
      width: 100%; background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px; margin: 12px 0; display: flex; align-items: center; gap: 15px; position: relative;
      box-shadow: var(--shadow);
    }
    .selected-game-logo {
      width: 60px; height: 60px; border-radius: 10px; border: 2px solid var(--border);
      object-fit: contain; padding: 5px; background: rgba(0, 212, 255, 0.05);
    }
    .selected-game-text { flex: 1; text-align: left; }
    .selected-game-text h3 { 
      font-size: 18px; 
      color: var(--text-main); margin-bottom: 5px;
    }
    .selected-game-text p { font-size: 13px; color: var(--text-soft); line-height: 1.5; }

    .info-hot-tag {
      position: absolute; top: -10px; right: -10px;
      font-size: 10px; padding: 4px 12px; border-radius: 15px;
      animation: pulse 2s infinite;
    }

    /* --- GAME DISPLAY --- */
    .game-display { 
      position: relative; 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      margin: 8px 0; 
    }

    .game-container {
      width: 65%; 
      max-width: 260px; 
      aspect-ratio: 1.15; 
      border-radius: 22px; 
      border: 2px solid var(--border);
      position: relative; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      z-index: 2;
      background: rgba(0, 10, 30, 0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0, 212, 255, 0.18), inset 0 1px 0 rgba(0, 212, 255, 0.15);
    }

    .circle-bg {
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
      z-index: 1;
    }

    .mid-line { 
      position: absolute; 
      top: 50%; left: 0; 
      width: 100%; 
      height: 1px; 
      background: var(--border); 
      transform: translateY(-50%); 
      z-index: 3; 
    }

    .top-half, .bottom-half { 
      flex: 1; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 3; 
    }

    .top-half { background: rgba(0, 212, 255, 0.04); }
    .bottom-half { background: rgba(0, 212, 255, 0.08); }

    .airplane-img {
      width: 80px; 
      height: 80px; 
      background: url('aviatorr.png') center no-repeat;
      background-size: contain; 
      animation: floatPlane 3s ease-in-out infinite; 
      filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.55));
      position: relative;
      z-index: 5;
    }

    @keyframes floatPlane {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    .multiplier { 
      font-size: 38px; 
      font-weight: 800; 
      color: var(--primary); 
      text-shadow: 0 2px 12px rgba(0, 212, 255, 0.45);
    }

    /* --- PROCESSING MESSAGES OVERLAY --- */
    .hacker-messages {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(2, 10, 30, 0.97);
      backdrop-filter: blur(12px);
      padding: 25px 30px;
      border-radius: 16px;
      font-size: 15px;
      color: var(--text-main);
      z-index: 20;
      display: none;
      text-align: left;
      border: 1px solid var(--primary);
      box-shadow: 0 20px 50px rgba(0, 212, 255, 0.25);
      max-width: 85%;
      width: 350px;
    }

    .hacker-messages.show { display: block; animation: fadeIn 0.3s ease-out; }

    .message-line {
      margin-bottom: 10px;
      opacity: 0;
      animation: typewriter 0.5s forwards;
      padding-left: 10px;
      border-left: 2px solid var(--primary);
      font-weight: 500;
    }

    .message-line:nth-child(1) { animation-delay: 0.2s; }
    .message-line:nth-child(2) { animation-delay: 0.8s; }
    .message-line:nth-child(3) { animation-delay: 1.4s; }
    .message-line:nth-child(4) { animation-delay: 2.0s; }
    .message-line:nth-child(5) { animation-delay: 2.6s; }

    @keyframes typewriter {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* --- ANIMATED PROCESSING BAR --- */
    .processing-bar-container {
      width: 100%;
      max-width: 280px;
      margin: 12px auto 8px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .processing-bar-container.show { display: flex; }

    .processing-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(0, 212, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .processing-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--btn-gradient);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .processing-status {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 12px;
      color: var(--text-soft);
      font-weight: 500;
    }
    .processing-status .result-time { color: var(--primary); font-weight: 600; }

    /* --- START BUTTON --- */
    .start-button-container { width: 100%; margin: 8px 0 12px; }

    .btn-predict {
      width: 100%; 
      padding: 18px; 
      background: var(--btn-gradient);
      color: #fff; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-predict:hover:not(.disabled):not(.hidden) { 
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0, 212, 255, 0.5);
      background: var(--btn-hover);
    }
    .btn-predict.hidden { display: none !important; }
    .btn-predict.disabled {
      background: rgba(0, 50, 80, 0.8) !important;
      color: #3a7a99 !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
      transform: none !important;
    }

    /* Result message shown while button is hidden */
    .result-apply-msg {
      display: none;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 80, 140, 0.2));
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 14px;
      color: #00d4ff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.3px;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.18);
      animation: fadeIn 0.4s ease;
    }
    .result-apply-msg.show { display: block; }

    /* --- WARNING BOX --- */
    .warning-box {
      width: 100%; 
      background: rgba(0, 10, 30, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 15px; 
      margin: 8px 0; 
      text-align: center; 
      color: var(--text-soft); 
      line-height: 1.6; 
      font-size: 13px;
      box-shadow: var(--shadow);
    }
    .info-text { color: var(--primary); font-weight: 500; }

    /* --- ACTION BUTTONS --- */
    .action-buttons { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin: 12px 0 30px; 
      width: 100%; 
      position: relative; 
    }

    .action-btn {
      padding: 16px 25px; 
      border-radius: 14px; 
      border: none; 
      color: #fff; 
      font-weight: 700; 
      cursor: pointer; 
      transition: transform 0.3s ease, filter 0.3s ease; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      text-decoration: none; 
      width: 100%; 
      font-size: 14px; 
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
      background: var(--btn-gradient);
      letter-spacing: 0.3px;
    }
    .action-btn:hover { 
      transform: translateY(-2px); 
      filter: brightness(1.15);
    }

    .telegram-btn { background: linear-gradient(135deg, #0088cc, #0077b5) !important; }
    .support-btn { background: linear-gradient(135deg, #00d4ff, #00d4ff) !important; }
    .gift-btn { background: linear-gradient(135deg, #f97316, #ea580c) !important; }

    .bonus-tag {
      position: absolute; 
      top: -10px; 
      right: -10px; 
      font-size: 10px;
      padding: 4px 12px; 
      border-radius: 15px;
      animation: pulse 2s infinite; 
      z-index: 2;
    }
    .register-btn-container { position: relative; width: 100%; }

    /* --- ANIMATIONS --- */
    @keyframes pulse { 
      0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.4); } 
      70% { box-shadow: 0 0 0 6px rgba(0, 212, 255, 0); } 
      100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); } 
    }
    @keyframes bounce { 
      0%,20%,50%,80%,100% { transform: translateY(0); } 
      40% { transform: translateY(-3px); } 
      60% { transform: translateY(-2px); } 
    }
    @keyframes countUp { 
      0% { transform: scale(0.8); opacity: 0.5; } 
      100% { transform: scale(1); opacity: 1; } 
    }
    .count-up { animation: countUp 1.2s ease-out; }
    .pulse { animation: pulse 2s infinite; }

    /* --- RESPONSIVE --- */
    @media (max-width: 420px) {
      body { padding: 6px; }
      .container { max-width: 100%; }
      .action-btn { padding: 14px 20px; font-size: 13px; }
      .multiplier { font-size: 32px; }
      .btn-predict { font-size: 15px; padding: 16px; }
      .warning-box { padding: 12px; font-size: 12px; }
      .moving-register-text { font-size: 12px; }
      .moving-register-btn { font-size: 11px; padding: 4px 10px; }
      .selected-game-info { padding: 12px; }
      .selected-game-logo { width: 50px; height: 50px; }
      .selected-game-text h3 { font-size: 16px; }
      .selected-game-text p { font-size: 12px; }
      .airplane-img { width: 60px; height: 60px; }
      .top-center-image { height: 48px; max-width: 340px; }
      .back-btn, .how-to-btn { font-size: 12px; padding: 6px 12px; }
    }
  
    /* === ROYAL PURPLE + GOLD THEME OVERRIDE (matches index.html) === */
    :root {
      --primary: #00d4ff;
      --primary-light: #33ddff;
      --primary-dark: #0099cc;
      --primary-soft: rgba(0, 212, 255, 0.14);
      --primary-glow: #33ddff;
      --accent: #33ddff;
      --accent-warm: #00d4ff;
      --accent-warm-light: #33ddff;

      --bg: #03050e;
      --bg-color: #03050e;
      --bg-dark: #03050e;
      --bg-grad-1: #03050e;
      --bg-grad-2: #07101e;
      --bg-card: rgba(0, 70, 120, 0.22);
      --bg-card-light: rgba(0, 70, 120, 0.14);
      --surface: rgba(0, 70, 120, 0.22);
      --surface-strong: #07101e;
      --glass: rgba(0, 70, 120, 0.22);
      --glass-hover: rgba(0, 70, 120, 0.32);

      --border: rgba(0, 212, 255, 0.25);
      --border-strong: rgba(0, 212, 255, 0.45);
      --border-highlight: rgba(0, 212, 255, 0.55);
      --card-bg: rgba(0, 70, 120, 0.18);
      --card-border: rgba(0, 212, 255, 0.25);

      --text: #d0eeff;
      --text-main: #d0eeff;
      --text-primary: #d0eeff;
      --text-soft: #6fa8c8;
      --text-secondary: #6fa8c8;
      --text-muted: #4a7a99;

      --dragon-color: #00d4ff;
      --tiger-color:  #33ddff;

      --shadow: 0 8px 28px rgba(0,0,0,.5);
      --shadow-sm: 0 4px 12px rgba(0,0,0,.35);
      --shadow-lg: 0 20px 40px rgba(0, 212, 255,.35);

      resultApplyMsg: document.getElementById('resultApplyMsg')
    };

    let currentSelectedGame = '91Club Hack';
    let isProcessing = false;
    let isCooldown = false;

    function renderGameOptions(filterText = '') {
      elements.gameOptions.innerHTML = '';
      const lowerFilter = filterText.trim().toLowerCase();
      let anyVisible = false;

      gameOrder.forEach(gameName => {
        const data = gameData[gameName];

        const match = !lowerFilter || gameName.toLowerCase().includes(lowerFilter);
        const option = document.createElement('div');
        option.className = 'game-option';
        let hotTag = data.isHot ? '<div class="hot-tag"><span class="es-ic" aria-hidden="true">🔥</span> HOT</div>' : '';

        option.addEventListener('click', () => selectGame(gameName));
        
        if (!match) option.style.display = 'none';
        else anyVisible = true;
        elements.gameOptions.appendChild(option);
      });

      if (!anyVisible && lowerFilter) {
        elements.gameOptions.querySelectorAll('.game-option').forEach(opt => opt.style.display = 'flex');
      }
    }

    function selectGame(gameName) {
      currentSelectedGame = gameName;
      const data = gameData[gameName];
      elements.selectedGameName.textContent = gameName;
      elements.selectedGameLogo.src = data.logo || 'default-logo.png';
      elements.selectedGameInfoLogo.src = data.logo || 'default-logo.png';
      elements.selectedGameTitle.textContent = gameName.toUpperCase();
      elements.selectedGameDescription.textContent = data.description || `${gameName.replace(' Hack','')} Aviator Mod* Earn Daily 💰`;
      elements.infoHotTag.style.display = data.isHot ? 'flex' : 'none';
      if (data.registerLink) elements.registerBtn.href = data.registerLink;
      const shortName = gameName.replace(' Hack', '');
      elements.registerText.textContent = `REGISTER ${shortName.toUpperCase()}`;
      elements.movingRegisterBtn.onclick = () => {
        if (data.registerLink) window.open(data.registerLink, '_blank');
      };
      elements.gameSelectorDropdown.classList.remove('show');
      __LS.setItem('selectedGame', gameName);

      if (gameName === '1win Hack') {
        elements.special1winBanner.style.display = 'block';
      } else {
        elements.special1winBanner.style.display = 'none';
      }
    }

    renderGameOptions();
    const savedGame = __LS.getItem('selectedGame');
    if (savedGame && gameData[savedGame]) selectGame(savedGame);

      if (elements.clickToChangeTag) {
        elements.clickToChangeTag.remove();

      elements.gameSelectorDropdown.classList.toggle('show');
      if (elements.gameSelectorDropdown.classList.contains('show')) {
        elements.gameSearch.value = '';
        renderGameOptions('');
        elements.gameSearch.focus();
      }
    });

    elements.gameSearch.addEventListener('input', (e) => {
      renderGameOptions(e.target.value);
    });

    document.addEventListener('click', (e) => {
      if (!elements.gameSelectorBtn.contains(e.target) && !elements.gameSelectorDropdown.contains(e.target)) {
        elements.gameSelectorDropdown.classList.remove('show');
      }
    });

    function updateUserCounter() {
      let current = parseInt(elements.onlineUsers.textContent.replace(/,/g, '')) || 8245;
      current += Math.floor(Math.random() * 500) - 250;
      current = Math.max(8000, Math.min(25000, current));
      elements.onlineUsers.textContent = current.toLocaleString();
      setTimeout(updateUserCounter, 2000 + Math.random() * 2000);
    }
    updateUserCounter();

    function generatePrediction() {
      // Generate 361 values, use only the 361st
      let val;
      for (let i = 0; i < 361; i++) {
        val = (Math.random() < 0.9 ? (Math.random() * 1.9 + 1.1) : (Math.random() * 0.5 + 3.0)).toFixed(2);
      }
      return val;
    }

    function animateMultiplier(finalValue) {
      let current = 0.0;
      const steps = 25;
      const increment = finalValue / steps;
      let step = 0;
      const timer = setInterval(() => {
        step++;
        current += increment;
        if (step >= steps) {
          current = finalValue;
          clearInterval(timer);
          elements.multiplier.classList.add('pulse');
        }
        elements.multiplier.textContent = current.toFixed(2) + 'x';
      }, 60);
    }

    function startProcessingSequence(callback) {
      if (isProcessing || isCooldown) return;
      isProcessing = true;

      elements.predictBtn.classList.add('hidden');
      if (elements.resultApplyMsg) elements.resultApplyMsg.classList.remove('show');
      elements.hackerMessages.classList.add('show');
      
      elements.processingBarContainer.classList.add('show');
      elements.processingBarFill.style.width = '0%';
      elements.resultTime.textContent = '⏱ 0.0s';

      let progress = 0;
      const startTime = Date.now();
      
      const barInterval = setInterval(() => {
        progress += 2;
        if (progress > 100) progress = 100;
        elements.processingBarFill.style.width = progress + '%';
        
        const elapsed = (Date.now() - startTime) / 1000;
        elements.resultTime.textContent = '⏱ ' + elapsed.toFixed(1) + 's';
        
        if (progress >= 100) {
          clearInterval(barInterval);
        }
      }, 50);

      setTimeout(() => {
        elements.hackerMessages.classList.remove('show');
        clearInterval(barInterval);
        elements.processingBarFill.style.width = '100%';
        
        const finalElapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        elements.resultTime.textContent = '⏱ ' + finalElapsed + 's ✓';
        
        callback();
        
        setTimeout(() => {
          elements.predictBtn.classList.remove('hidden');
          if (elements.resultApplyMsg) elements.resultApplyMsg.classList.add('show');
          elements.processingBarContainer.classList.remove('show');
          
          isCooldown = true;
          elements.predictBtn.classList.add('disabled');
          elements.predictBtn.innerHTML = '<span class="es-ic" aria-hidden="true">⏳</span> WAIT ' + (1.5).toFixed(0) + 's';
          
          let cd = 1.5;
          const cdInterval = setInterval(() => {
            cd -= 0.1;
            if (cd <= 0) {
              clearInterval(cdInterval);
              elements.predictBtn.classList.remove('disabled');
              elements.predictBtn.innerHTML = '<span class="es-ic" aria-hidden="true">🚀</span> START PREDICTION';
              if (elements.resultApplyMsg) elements.resultApplyMsg.classList.remove('show');
              isCooldown = false;
            } else {
              elements.predictBtn.innerHTML = '<span class="es-ic" aria-hidden="true">⏳</span> WAIT ' + cd.toFixed(0) + 's';
            }
          }, 100);
          
          isProcessing = false;
        }, 500);
      }, 2000);
    }

    elements.predictBtn.addEventListener('click', function() {
      if (isProcessing || isCooldown || this.classList.contains('hidden')) return;

      elements.multiplier.classList.remove('count-up', 'pulse');
      elements.multiplier.textContent = '0.00x';

      startProcessingSequence(() => {
        const prediction = parseFloat(generatePrediction());
        elements.multiplier.classList.add('count-up');
        animateMultiplier(prediction);
      });
    });

    document.getElementById('howToUseBtn').addEventListener('click', () => {
      document.getElementById('howToModal').style.display = 'flex';
    });
    window.closeHowToModal = function() {
      document.getElementById('howToModal').style.display = 'none';
    };
    document.getElementById('howToModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('howToModal')) closeHowToModal();
    });

  })();
  <\/script>

   GAME CONFIG — read from URL params then localStorage
   Saves selected game into localStorage key 'currentGame'
════════════════════════════════════════════════════════ */
const GAME_CFG = (function() {
    // 1) Try URL search params (?tag=...&name=91Club_RANDOMHASH&logo=...)
    const p = new URLSearchParams(__loc.search);
    let tag  = p.get('tag')  || '';
    // Strip the random hash from name — URL carries "91Club_HASH", we only want "91Club"
    let name = (p.get('name') || '').split('_')[0];
    let logo = p.get('logo') || '';

    // 2) Fall back to localStorage currentGame (always stored clean)
    if (!tag) {
        try {
            const stored = JSON.parse(__LS.getItem('currentGame') || '{}');
            tag  = stored.tagKey || stored.tag || '';
            name = stored.name   || '';
            logo = stored.logo   || '';
        } catch(e) {}
    }

    // 3) Defaults
    if (!tag)  tag  = '91club';
    if (!name) name = '91Club';

    // 4) Persist clean values so back-navigation also works
    __LS.setItem('currentGame', JSON.stringify({ tagKey: tag, name: name, logo: logo }));

    return { tag: tag, name: name, logo: logo };
})();

        .fl-mcool { animation:flLMCool 3.6s ease-in-out infinite; transform-origin:50% 100%; opacity:0.72; }
        .fl-outer { animation:flLOut   4.8s ease-in-out infinite; transform-origin:50% 100%; opacity:0.45; }

        .fr-core  { animation:frRCore  2.1s ease-in-out infinite; transform-origin:50% 100%; }
        .fr-mhot  { animation:frRMHot  2.9s ease-in-out infinite; transform-origin:50% 100%; opacity:0.92; }
        .fr-mcool { animation:frRMCool 3.8s ease-in-out infinite; transform-origin:50% 100%; opacity:0.72; }
        .fr-outer { animation:frROut   5.1s ease-in-out infinite; transform-origin:50% 100%; opacity:0.45; }

        /* LEFT keyframes — wing curves left-outward */
        @keyframes flLCore {
            0%   { transform:scaleY(1)    scaleX(1)    skewX(-4deg)  translateX(-2px); opacity:1;    }
            18%  { transform:scaleY(1.16) scaleX(0.88) skewX(-8deg)  translateX(-5px); opacity:1;    }
            35%  { transform:scaleY(0.90) scaleX(1.08) skewX(-1deg)  translateX(0px);  opacity:0.90; }
            55%  { transform:scaleY(1.22) scaleX(0.86) skewX(-7deg)  translateX(-4px); opacity:1;    }
            72%  { transform:scaleY(0.93) scaleX(1.06) skewX(-2deg)  translateX(1px);  opacity:0.93; }
            88%  { transform:scaleY(1.12) scaleX(0.91) skewX(-5deg)  translateX(-3px); opacity:0.98; }
            100% { transform:scaleY(1)    scaleX(1)    skewX(-4deg)  translateX(-2px); opacity:1;    }
        }
        @keyframes flLMHot {
            0%   { transform:scaleY(0.95) scaleX(1.04) skewX(-3deg); opacity:0.92; }
            22%  { transform:scaleY(1.18) scaleX(0.88) skewX(-9deg); opacity:1;    }
            44%  { transform:scaleY(0.87) scaleX(1.10) skewX(-2deg); opacity:0.80; }
            68%  { transform:scaleY(1.14) scaleX(0.90) skewX(-7deg); opacity:0.95; }
            100% { transform:scaleY(0.95) scaleX(1.04) skewX(-3deg); opacity:0.92; }
        }
        @keyframes flLMCool {
            0%   { transform:scaleY(1.06) scaleX(0.96) translateX(-3px) skewX(-5deg); opacity:0.72; }
            30%  { transform:scaleY(0.84) scaleX(1.11) translateX(1px)  skewX(-1deg); opacity:0.82; }
            58%  { transform:scaleY(1.24) scaleX(0.84) translateX(-4px) skewX(-6deg); opacity:0.60; }
            84%  { transform:scaleY(0.91) scaleX(1.06) translateX(0px)  skewX(-2deg); opacity:0.75; }
            100% { transform:scaleY(1.06) scaleX(0.96) translateX(-3px) skewX(-5deg); opacity:0.72; }
        }
        @keyframes flLOut {
            0%   { transform:scaleY(1.10) scaleX(0.94) skewX(-6deg); opacity:0.45; }
            38%  { transform:scaleY(0.82) scaleX(1.12) skewX(-2deg); opacity:0.58; }
            72%  { transform:scaleY(1.26) scaleX(0.82) skewX(-7deg); opacity:0.32; }
            100% { transform:scaleY(1.10) scaleX(0.94) skewX(-6deg); opacity:0.45; }
        }

        /* RIGHT keyframes — wing curves right-outward */
        @keyframes frRCore {
            0%   { transform:scaleY(1)    scaleX(1)    skewX(4deg)  translateX(2px);  opacity:1;    }
            18%  { transform:scaleY(1.14) scaleX(0.89) skewX(8deg)  translateX(5px);  opacity:1;    }
            35%  { transform:scaleY(0.91) scaleX(1.07) skewX(1deg)  translateX(0px);  opacity:0.91; }
            55%  { transform:scaleY(1.20) scaleX(0.87) skewX(7deg)  translateX(4px);  opacity:1;    }
            72%  { transform:scaleY(0.94) scaleX(1.05) skewX(2deg)  translateX(-1px); opacity:0.94; }
            88%  { transform:scaleY(1.11) scaleX(0.92) skewX(5deg)  translateX(3px);  opacity:0.97; }
            100% { transform:scaleY(1)    scaleX(1)    skewX(4deg)  translateX(2px);  opacity:1;    }
        }
        @keyframes frRMHot {
            0%   { transform:scaleY(0.96) scaleX(1.03) skewX(3deg);  opacity:0.92; }
            24%  { transform:scaleY(1.16) scaleX(0.89) skewX(8deg);  opacity:1;    }
            47%  { transform:scaleY(0.88) scaleX(1.09) skewX(2deg);  opacity:0.82; }
            70%  { transform:scaleY(1.12) scaleX(0.91) skewX(6deg);  opacity:0.94; }
            100% { transform:scaleY(0.96) scaleX(1.03) skewX(3deg);  opacity:0.92; }
        }
        @keyframes frRMCool {
            0%   { transform:scaleY(1.05) scaleX(0.97) translateX(3px)  skewX(5deg); opacity:0.72; }
            32%  { transform:scaleY(0.85) scaleX(1.10) translateX(-1px) skewX(1deg); opacity:0.80; }
            60%  { transform:scaleY(1.22) scaleX(0.85) translateX(4px)  skewX(6deg); opacity:0.62; }
            86%  { transform:scaleY(0.92) scaleX(1.05) translateX(0px)  skewX(2deg); opacity:0.74; }
            100% { transform:scaleY(1.05) scaleX(0.97) translateX(3px)  skewX(5deg); opacity:0.72; }
        }
        @keyframes frROut {
            0%   { transform:scaleY(1.09) scaleX(0.95) skewX(6deg);  opacity:0.45; }
            40%  { transform:scaleY(0.83) scaleX(1.11) skewX(2deg);  opacity:0.56; }
            74%  { transform:scaleY(1.24) scaleX(0.83) skewX(7deg);  opacity:0.34; }
            100% { transform:scaleY(1.09) scaleX(0.95) skewX(6deg);  opacity:0.45; }
        }

        /* Sparks floating upward — 5 per side, brighter */
        .spark { animation:sparkUp 2.2s ease-in-out infinite; transform-origin:50% 50%; }
        .spark:nth-child(1) { animation-duration:1.9s; animation-delay:0s; }
        .spark:nth-child(2) { animation-duration:2.9s; animation-delay:-0.7s; }
        .spark:nth-child(3) { animation-duration:1.6s; animation-delay:-1.3s; }
        .spark:nth-child(4) { animation-duration:2.4s; animation-delay:-0.25s; }
        .spark:nth-child(5) { animation-duration:1.8s; animation-delay:-1.0s; }
        @keyframes sparkUp {
            0%   { transform:translateY(0)    scale(1.1);  opacity:1;    }
            30%  { transform:translateY(-16px) scale(1.6);  opacity:0.75; }
            65%  { transform:translateY(-34px) scale(1.0);  opacity:0.30; }
            100% { transform:translateY(-52px) scale(0.2);  opacity:0;    }
        }

        /* Wing-breathing pulse — glow fires only via .blaze-pop */
        .wing-wrapper-left  { animation:breatheL 5s ease-in-out infinite; }
        .wing-wrapper-right { animation:breatheR 5.5s ease-in-out infinite; }
        @keyframes breatheL {
            0%,100% { transform:translateZ(0) scaleY(1);    filter:drop-shadow(0 0 6px rgba(0,200,120,0.55)) drop-shadow(0 0 14px rgba(0,100,255,0.3)); opacity:0.82; }
            50%     { transform:translateZ(0) scaleY(1.05); filter:drop-shadow(0 0 10px rgba(0,255,140,0.75)) drop-shadow(0 0 22px rgba(0,140,255,0.5)); opacity:0.95; }
        }
        @keyframes breatheR {
            0%,100% { transform:translateZ(0) scaleY(1);    filter:drop-shadow(0 0 6px rgba(0,200,120,0.55)) drop-shadow(0 0 14px rgba(0,100,255,0.3)); opacity:0.82; }
            50%     { transform:translateZ(0) scaleY(1.06); filter:drop-shadow(0 0 10px rgba(0,255,140,0.75)) drop-shadow(0 0 22px rgba(0,140,255,0.5)); opacity:0.95; }
        }

        /* Panel flash — bright white/cyan burst on new period or result switch */
        @keyframes panelFlash {
            0%   { box-shadow:0 0 28px rgba(0,160,255,0.45),inset 0 0 18px rgba(0,120,255,0.18),0 0 60px rgba(0,100,200,0.15); border-color:rgba(0,180,255,0.55); }
            20%  { box-shadow:0 0 0 3px rgba(0,220,255,0.6),0 0 36px rgba(0,200,255,0.65),inset 0 0 14px rgba(0,180,255,0.2); border-color:rgba(0,220,255,0.75); }
            100% { box-shadow:0 0 28px rgba(0,160,255,0.45),inset 0 0 18px rgba(0,120,255,0.18),0 0 60px rgba(0,100,200,0.15); border-color:rgba(0,180,255,0.55); }
        }
        .panel-flash { animation:panelFlash 0.6s ease-out forwards !important; }

        /* Blaze pop — fires ONLY on switch/new-period; green-blue burst matching flame colour */
        @keyframes blazePop {
            0%   { filter:drop-shadow(0 0 6px rgba(0,200,120,0.55)) drop-shadow(0 0 14px rgba(0,100,255,0.3)); opacity:0.82; }
            15%  { filter:brightness(2.2) drop-shadow(0 0 24px #00ffaa) drop-shadow(0 0 48px #00ccff) drop-shadow(0 0 70px #0066ff); opacity:1; }
            45%  { filter:brightness(1.4) drop-shadow(0 0 14px #55ffbb) drop-shadow(0 0 28px rgba(0,180,255,0.7)); opacity:0.92; }
            100% { filter:drop-shadow(0 0 6px rgba(0,200,120,0.55)) drop-shadow(0 0 14px rgba(0,100,255,0.3)); opacity:0.82; }
        }
        .blaze-pop { animation:blazePop 0.65s ease-out forwards !important; }

        .main-panel {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:linear-gradient(145deg,rgba(2,8,22,0.97),rgba(1,5,15,0.98));
            border:1.5px solid rgba(0,180,255,0.55); border-radius:14px; padding:8px 14px 10px;
            box-shadow:none;
            backdrop-filter:blur(10px); display:flex; flex-direction:column;
            justify-content:space-between; cursor:grab;
        }
        .main-panel:active { cursor:grabbing; }
        /* startup-glow: fires once on load, lasts 1.5s */
        @keyframes startupGlow {
            0%   { box-shadow:0 0 0 0 rgba(0,180,255,0); }
            20%  { box-shadow:0 0 0 8px rgba(0,220,255,0.55), 0 0 50px rgba(0,180,255,0.7), inset 0 0 24px rgba(0,160,255,0.3); }
            60%  { box-shadow:0 0 0 4px rgba(0,200,255,0.35), 0 0 30px rgba(0,160,255,0.45); }
            100% { box-shadow:none; }
        }
        .startup-glow { animation:startupGlow 1.5s ease-out forwards; }

        /* Header: logo + title stacked */
        .panel-header {
            display:flex; flex-direction:column; align-items:center; gap:3px;
            padding:0 4px 6px; border-bottom:1px solid rgba(0,160,255,0.2);
            pointer-events:none;
        }
        .panel-logo {
            width:28px; height:28px; border-radius:50%; object-fit:cover;
            border:1.5px solid rgba(0,200,255,0.5);
            box-shadow:0 0 10px rgba(0,180,255,0.55);
        }
        .title {
            font-family:'Orbitron',sans-serif; color:#c8e8ff; font-size:14px; text-align:center;
            letter-spacing:2px; font-weight:900;
            text-shadow:0 0 8px rgba(0,180,255,0.8),0 0 20px rgba(0,140,255,0.5);
            margin:0;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            font-family:'Orbitron',sans-serif; font-size:7.5px; color:#7ab8d8; font-weight:700;
            padding:0 2px; pointer-events:none; margin-bottom:4px;
        }
        .status-item { display:flex; align-items:center; gap:4px; }
        .dot {
            width:5px; height:5px; background:#00d4ff; border-radius:50%;
            box-shadow:0 0 8px #00d4ff; animation:blink 0.8s infinite alternate;
        }
        @keyframes blink { 0%{opacity:1;} 100%{opacity:0.2;} }

        .radar-box {
            background:#010814; border:1px solid rgba(0,100,180,0.3); border-radius:10px; flex-grow:1;
            position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
            overflow:hidden; box-shadow:inset 0 0 20px rgba(0,120,255,0.12); pointer-events:none; margin-bottom:7px;
            min-height:128px;
        }
        #blue-stars { position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        .radar-bg {
            position:absolute; top:0; left:0; right:0; bottom:0;
            background-image:linear-gradient(rgba(0,160,255,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,160,255,0.08) 1px,transparent 1px);
            background-size:20px 20px; z-index:1;
        }
        .scanner-line {
            position:absolute; top:-10px; left:0; right:0; height:2px;
            background:#00d4ff; box-shadow:0 0 10px #00d4ff,0 0 30px #00aaff; z-index:2; display:none;
        }
        .scanning .scanner-line { display:block; animation:scanLine 1.2s linear infinite; }
        @keyframes scanLine { 0%{top:0%;opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{top:100%;opacity:0;} }

        .advanced-loader {
            display:none; flex-direction:column; align-items:center; justify-content:center;
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,5,20,0.75); backdrop-filter:blur(3px); z-index:20;
        }
        .cyber-ring-container { position:relative; width:60px; height:60px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
        .cyber-ring-outer {
            position:absolute; width:100%; height:100%; border-radius:50%;
            border:3px solid transparent; border-top-color:#00d4ff; border-bottom-color:#0088cc;
            animation:spinRing 1s linear infinite; filter:drop-shadow(0 0 5px #00d4ff);
        }
        .cyber-ring-inner { position:absolute; width:70%; height:70%; border-radius:50%; border:2px dashed #66ccff; animation:spinRingRev 2s linear infinite; }
        .cyber-core { width:12px; height:12px; background:#00d4ff; border-radius:50%; animation:pulseCore 0.5s ease-in-out infinite alternate; }
        @keyframes spinRing    { 100%{transform:rotate(360deg);}  }
        @keyframes spinRingRev { 100%{transform:rotate(-360deg);} }
        @keyframes pulseCore   { 0%{transform:scale(0.8);} 100%{transform:scale(1.5);} }

        .loading-status-text {
            font-family:'Orbitron',sans-serif; font-size:11px; color:#66ccff; font-weight:900;
            letter-spacing:2px; text-shadow:0 0 8px #00aaff; text-align:center;
        }

        /* Result area — centre of radar-box, period pill at bottom */
        .result-content {
            position:relative; z-index:5; display:flex; flex-direction:column;
            align-items:center; justify-content:center; width:100%; height:100%; gap:0;
        }
        /* Result text — big, centred for ALL single-type modes */
        .result-text {
            font-family:'Orbitron',sans-serif; font-size:34px; color:#c8eeff; font-weight:900;
            text-shadow:0 0 12px #00d4ff,0 0 26px #0088cc; letter-spacing:3px;
            text-align:center; opacity:0; transform:scale(0.5); line-height:1;
            width:100%; display:block;
        }
        .pop-in { animation:popResult 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        @keyframes popResult { 0%{opacity:0;transform:scale(0.5);} 100%{opacity:1;transform:scale(1);} }

        /* Number circle — bottom-left corner; acts as green/red ball with image */
        .result-num-circle {
            display:none; align-items:center; justify-content:center;
            width:34px; height:34px; border-radius:50%;
            border:2px solid rgba(255,255,255,0.35);
            box-shadow:0 0 12px rgba(0,220,100,0.5), inset 0 0 8px rgba(0,0,0,0.4);
            background:radial-gradient(circle at 38% 32%, #22ee88, #00aa44, #005522);
            opacity:0; transform:scale(0.6);
            transition:opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s;
            position:absolute; bottom:6px; left:8px;
            overflow:hidden;
        }
        .result-num-circle.show { display:flex; opacity:1; transform:scale(1); }
        .result-num-circle.red-ball {
            background:radial-gradient(circle at 38% 32%, #ff5566, #dd1122, #880011);
            box-shadow:0 0 12px rgba(255,60,60,0.6), inset 0 0 8px rgba(0,0,0,0.4);
        }
        /* Number image inside ball — covers text when loaded */
        .result-num-ball-img {
            width:100%; height:100%; object-fit:cover; border-radius:50%;
            position:absolute; top:0; left:0; z-index:2;
            display:none;
        }
        .result-num-ball-img.loaded { display:block; }
        .result-num-text {
            font-family:'Orbitron',sans-serif; font-size:15px; font-weight:900;
            color:#ffffff; text-shadow:0 1px 4px rgba(0,0,0,0.8);
            line-height:1; position:relative; z-index:1;
        }
        /* Hide text when image is successfully loaded */
        .result-num-circle.img-loaded .result-num-text { display:none; }

        /* Color label — bottom-right corner */
        .result-color-label {
            display:none; font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:900;
            letter-spacing:2px; opacity:0; transform:translateY(4px);
            transition:opacity 0.3s ease 0.25s, transform 0.3s ease 0.25s;
            position:absolute; bottom:7px; right:8px;
        }
        .result-color-label.show { display:block; opacity:1; transform:translateY(0); }
        .result-color-label.green { color:#00ff88; text-shadow:0 0 10px #00cc66,0 0 20px #009944; }
        .result-color-label.red   { color:#ff3333; text-shadow:0 0 10px #ff0000,0 0 20px #cc0000; }

        /* Sub-info row kept for size+num / colour modes */
        .result-sub-row {
            display:none; align-items:center; justify-content:center; gap:10px;
            font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:900; letter-spacing:1px;
            opacity:0; transform:translateY(4px);
            transition:opacity 0.3s ease 0.2s, transform 0.3s ease 0.2s;
        }
        .result-sub-row.show { display:flex; opacity:1; transform:translateY(0); }
        .sub-range { color:#c8e8ff; text-shadow:0 0 6px rgba(0,180,255,0.5); }
        .sub-divider { color:rgba(0,180,255,0.35); font-size:16px; }
        .sub-color-green { color:#00ff88; text-shadow:0 0 8px #00cc66; }
        .sub-color-red   { color:#ff4455; text-shadow:0 0 8px #cc2233; }

        /* Show-only-numbers result: balls as green/red circles, centred */
        .result-nums-only {
            display:none; align-items:center; justify-content:center;
            gap:10px; flex-wrap:wrap; padding:0 6px;
            position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        }
        .result-nums-only.show { display:flex; }
        /* Number balls — slightly reduced */
        .num-only-digit {
            width:32px; height:32px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-family:'Orbitron',sans-serif; font-size:15px; font-weight:900;
            color:#ffffff; text-shadow:0 1px 4px rgba(0,0,0,0.8);
            line-height:1; opacity:0; animation:popResult 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
            border:2px solid rgba(255,255,255,0.25); overflow:hidden; position:relative;
            box-shadow:0 0 8px rgba(0,0,0,0.6);
        }
        /* Even digits = red ball, odd = green ball */
        .num-only-digit.even-ball {
            background:radial-gradient(circle at 38% 32%, #ff5566, #dd1122, #880011);
            box-shadow:0 0 10px rgba(255,60,60,0.5);
        }
        .num-only-digit.odd-ball {
            background:radial-gradient(circle at 38% 32%, #22ee88, #00aa44, #005522);
            box-shadow:0 0 10px rgba(0,200,80,0.5);
        }
        .num-only-digit:nth-child(1){ animation-delay:0.05s; }
        .num-only-digit:nth-child(2){ animation-delay:0.12s; }
        .num-only-digit:nth-child(3){ animation-delay:0.19s; }
        .num-only-digit:nth-child(4){ animation-delay:0.26s; }
        /* Ball image overlay */
        .num-ball-img {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:50%; object-fit:cover; z-index:1;
        }
        .num-ball-label { position:relative; z-index:2; }

        /* ── Period strip — between mode buttons and radar box ── */
        .period-strip {
            display:flex; flex-direction:column; align-items:center; gap:1px;
            background:rgba(0,5,20,0.88); border:1.5px solid rgba(0,180,255,0.55);
            border-radius:9px; padding:3px 14px 4px;
            box-shadow:0 0 12px rgba(0,160,255,0.35),inset 0 0 5px rgba(0,100,200,0.12);
            margin-bottom:5px; pointer-events:none;
        }
        .period-strip-label {
            font-family:'Courier New',Courier,monospace; font-size:7.5px; font-weight:700;
            color:#7aaabb; letter-spacing:1.8px; text-transform:uppercase;
            display:flex; align-items:center; gap:3px;
        }
        .period-strip-arrow { font-size:7.5px; color:#00d4ff; }
        #period-number {
            font-family:'Courier New',Courier,monospace; font-weight:700; font-size:14px;
            color:#ffffff; letter-spacing:1px; display:block;
            text-shadow:0 0 8px rgba(0,200,255,0.65);
        }

        .btn-group { display:flex; gap:9px; }
        #yaarwin-vip-root button {
            flex:1; padding:8px 0; border-radius:9px; font-family:'Orbitron',sans-serif; font-size:13px; font-weight:800;
            letter-spacing:0.5px; cursor:pointer; border:none; transition:all 0.12s ease; position:relative; z-index:20;
        }
        #yaarwin-vip-root button:active { transform:scale(0.93); }
        .btn-execute {
            background:linear-gradient(180deg,#0088cc 0%,#004466 100%); color:#fff;
            border:1px solid rgba(0,220,255,0.6);
            box-shadow:0 3px 0 rgba(0,0,0,0.7),0 4px 14px rgba(0,160,255,0.45),inset 0 1px 0 rgba(255,255,255,0.15);
            text-shadow:0 1px 3px rgba(0,0,0,0.8);
        }
        .btn-execute:hover { background:linear-gradient(180deg,#00aaee 0%,#005580 100%); }
        .btn-hide {
            background:linear-gradient(180deg,#141c2e,#090e1c); color:#7aabcc;
            border:1px solid rgba(0,120,200,0.3);
            box-shadow:0 3px 0 rgba(0,0,0,0.7),0 3px 10px rgba(0,0,0,0.7);
        }
        .btn-hide:hover { background:linear-gradient(180deg,#1a2540,#0d1428); color:#a0c8e8; border-color:rgba(0,160,255,0.4); }
    `;

    /* ── ORB SVG PLASMA RING ─────────────────────────────────
       Blue plasma arc ring replaces the old feather ring.
       z-index:5 → behind image(z:20) and shine(z:21)          */
    function buildOrbRing(){
        var NS='http://www.w3.org/2000/svg';
        var SZ=140,CX=70,CY=70;
        var svg=document.createElementNS(NS,'svg');
        svg.setAttribute('width',SZ); svg.setAttribute('height',SZ);
        svg.setAttribute('viewBox','0 0 '+SZ+' '+SZ);
        svg.style.cssText='position:absolute;left:50%;top:50%;margin:-70px 0 0 -70px;'
            +'width:'+SZ+'px;height:'+SZ+'px;pointer-events:none;z-index:5;overflow:visible;'
            +'animation:orbRingRotate 5s linear infinite;';
        var defs=document.createElementNS(NS,'defs');
        function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
        // conic gradient approximated via angular stops on a conicalGradient-like arc
        var rg=mk('linearGradient',{id:'plasmaArc',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
        [[0,'#00d4ff',1],[33,'#0088cc',0.85],[66,'#004488',0.5],[100,'#00d4ff',0.9]].forEach(function(s){
            rg.appendChild(mk('stop',{offset:s[0]+'%','stop-color':s[1],'stop-opacity':s[2]}));
        });
        defs.appendChild(rg);
        var flt=mk('filter',{id:'plasmaGlow',x:'-30%',y:'-30%',width:'160%',height:'160%'});
        flt.innerHTML='<feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>'
            +'<feFlood flood-color="#00aaff" flood-opacity="0.6" result="c"/>'
            +'<feComposite in="c" in2="b" operator="in" result="g"/>'
            +'<feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>';
        defs.appendChild(flt);
        svg.appendChild(defs);
        // Draw 8 plasma arc dashes around the orb
        var R=37, N=8;
        for(var i=0;i<N;i++){
            var a1=(i/N)*2*Math.PI - 0.25;
            var a2=a1+0.38;
            var x1=CX+R*Math.sin(a1), y1=CY-R*Math.cos(a1);
            var x2=CX+R*Math.sin(a2), y2=CY-R*Math.cos(a2);
            var arc=mk('path',{
                d:'M '+x1.toFixed(2)+','+y1.toFixed(2)+' A '+R+','+R+' 0 0,1 '+x2.toFixed(2)+','+y2.toFixed(2),
                fill:'none',stroke:'url(#plasmaArc)','stroke-width':'2.5',
                'stroke-linecap':'round',filter:'url(#plasmaGlow)',opacity:(0.7+i*0.03).toFixed(2)
            });
            svg.appendChild(arc);
            // small plasma dot at start of each arc
            var dot=mk('circle',{cx:x1.toFixed(2),cy:y1.toFixed(2),r:'2',
                fill:'#00d4ff',filter:'url(#plasmaGlow)',opacity:'0.85'});
            svg.appendChild(dot);
        }
        return svg;
    }

    /* Corner flames: single shared canvas, 2 corners only, capped at 30fps */
    function triggerCornerFlames() {
        const DURATION = 1500;
        const W = window.innerWidth, H = window.innerHeight;
        const corners = [
            { x: 0, y: 0,  angle: 45  },
            { x: W, y: 0,  angle: 135 },
            { x: 0, y: H,  angle: -45 },
            { x: W, y: H,  angle: -135 },
        ];
        const canvases = corners.map(c => {
            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            Object.assign(cv.style, {
                position:'fixed', top:'0', left:'0', width:'100%', height:'100%',
                pointerEvents:'none', zIndex:'99999', opacity:'1',
                transition:'opacity 0.35s ease'
            });
            document.body.appendChild(cv);
            return { cv, ctx: cv.getContext('2d'), origin: c };
        });
        const pools = canvases.map(() => []);
        function spawnParticle(pool, origin) {
            const spread = 38;
            const baseAngle = (origin.angle * Math.PI) / 180;
            const angle = baseAngle + (Math.random() - 0.5) * (spread * Math.PI / 180);
            const speed = 2.5 + Math.random() * 3.5;
            pool.push({
                x: origin.x, y: origin.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 1.0, decay: 0.018 + Math.random() * 0.022,
                size: 4 + Math.random() * 9,
                hue: 120 + Math.random() * 60
            });
        }
        const start = performance.now();
        function frame(now) {
            const elapsed = now - start;
            const spawnActive = elapsed < DURATION - 350;
            canvases.forEach(({ ctx, cv, origin }, i) => {
                ctx.clearRect(0, 0, cv.width, cv.height);
                const pool = pools[i];
                if (spawnActive) { for (let s = 0; s < 5; s++) spawnParticle(pool, origin); }
                for (let p = pool.length - 1; p >= 0; p--) {
                    const pt = pool[p];
                    pt.x += pt.vx; pt.y += pt.vy;
                    pt.vy += 0.07; pt.vx *= 0.986;
                    pt.life -= pt.decay; pt.size *= 0.977;
                    if (pt.life <= 0 || pt.size < 0.8) { pool.splice(p, 1); continue; }
                    const g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.size);
                    g.addColorStop(0,   `hsla(${pt.hue+60},100%,95%,${pt.life})`);
                    g.addColorStop(0.3, `hsla(${pt.hue+20},100%,72%,${pt.life*0.9})`);
                    g.addColorStop(0.7, `hsla(${pt.hue},   100%,52%,${pt.life*0.55})`);
                    g.addColorStop(1,   `hsla(${pt.hue-20},100%,32%,0)`);
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
                    ctx.fillStyle = g; ctx.fill();
                }
            });
            if (elapsed < DURATION + 400) {
                requestAnimationFrame(frame);
            } else {
                canvases.forEach(({ cv }) => { cv.style.opacity = '0'; });
                setTimeout(() => canvases.forEach(({ cv }) => cv.remove()), 400);
            }
        }
        requestAnimationFrame(frame);
    }

            let hist = JSON.parse(__LS.getItem(hKey) || '[]');
            const idx = hist.findIndex(h => h.period === period);
            // Always capture 4 digits for WinGo records so numsonly history always works.

            if (activePanelMode.startsWith('WinGo')) {
                if (Array.isArray(savePeriodResult._numsOnlyDigits) && savePeriodResult._numsOnlyDigits.length === 4) {
                    digits4 = savePeriodResult._numsOnlyDigits.slice();
                } else {
                    // Fallback: generate deterministically from period + num so it stays stable
                    const seed = String(period) + String(num);
                    let h = 0;
                    for (let i = 0; i < seed.length; i++) { h = Math.imul(31, h) + seed.charCodeAt(i) | 0; }

                    digits4 = [];
                    while (digits4.length < 4) {
                        const d = Math.floor(rng() * 10);
                        if (!digits4.includes(d)) digits4.push(d);
                    }
                }
            }
            savePeriodResult._numsOnlyDigits = null;
            const rec = { period, result: value, num, ts: Date.now() };
            if (digits4) rec.digits4 = digits4;
            if (idx !== -1) {
                hist[idx] = rec;

                hist.unshift(rec);
