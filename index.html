    function showResultDirect(text, num) {
        advancedLoader.style.display = 'none';
        radarBox.classList.remove('scanning');
        resultText.classList.remove('pop-in');

        // Reset all optional elements
        resultText.style.color      = '#c8eeff';
        resultText.style.textShadow = '0 0 15px #00d4ff,0 0 30px #0088cc,0 0 45px #0055aa';
        resultText.style.display    = '';
        resultNumCircle.classList.remove('show');
        resultColorLabel.classList.remove('show');
        resultColorLabel.className = 'result-color-label';
        resultSubRow.classList.remove('show');
        if (resultNumsOnly) { resultNumsOnly.classList.remove('show'); resultNumsOnly.innerHTML = ''; }

        if (activePanelMode === 'WinGo30s' || activePanelMode === 'WinGo1m') {
            const n2 = typeof num === 'number' && num >= 0 ? num : getResultNumber(text);
            const isEven   = n2 % 2 === 0;
            const colorStr = isEven ? 'RED' : 'GREEN';

            // Always generate & cache 4 unique digits for this WinGo period
            // so history always has them regardless of current display mode.
            {
                const periodKey = periodNumber ? periodNumber.innerText : '';
                const NUMS_KEY = GAME_CFG.tag + '_numsonly_' + activePanelMode;
                if (!showResultDirect._digitsCache) {
                    let stored = {};
                    try { stored = JSON.parse(__LS.getItem(NUMS_KEY) || '{}'); } catch (e) { stored = {}; }
                    showResultDirect._digitsCache = (stored && typeof stored === 'object') ? stored : {};
                }
                const cached = periodKey ? showResultDirect._digitsCache[periodKey] : null;
                let digits4;
                if (Array.isArray(cached) && cached.length === 4) {
                    digits4 = cached.slice();
                } else {
                    digits4 = [];
                    while (digits4.length < 4) {
                        const d = Math.floor(Math.random() * 10);
                        if (!digits4.includes(d)) digits4.push(d);
                    }
                    if (periodKey) {
                        showResultDirect._digitsCache[periodKey] = digits4;
                        // Keep cache small — only last 20 periods
                        const keys = Object.keys(showResultDirect._digitsCache);
                        if (keys.length > 20) delete showResultDirect._digitsCache[keys[0]];
                        try { __LS.setItem(NUMS_KEY, JSON.stringify(showResultDirect._digitsCache)); } catch (e) {}
                    }
                }
                showResultDirect._lastDigits = digits4;
                // Always stash for savePeriodResult — will be used regardless of hpResultType
                savePeriodResult._numsOnlyDigits = digits4;
            }

            if (hpResultType === 'numsonly') {
                // Show Only Numbers mode: display the 4 pre-generated digits
                resultText.style.display = 'none';
                if (resultNumsOnly) {
                    const digits = showResultDirect._lastDigits;
                    resultNumsOnly.innerHTML = digits.map(d => {
                        const ballClass = d % 2 === 0 ? 'even-ball' : 'odd-ball';
                        return `<span class="num-only-digit ${ballClass}">` +
                               `<img class="num-ball-img" src="${d}.png" alt="" onerror="this.style.display='none'">` +
                               `<span class="num-ball-label">${d}</span></span>`;
                    }).join('');
                    resultNumsOnly.classList.add('show');
                }
            } else if (hpResultType === 'size') {
                resultText.innerText = text;

            } else if (hpResultType === 'size+num') {
                resultText.innerText = text;
                applyBallColour(resultNumCircle, n2);
                resultNumCircle.classList.add('show');

            } else if (hpResultType === 'colour') {
                resultText.innerText    = colorStr;
                resultText.style.color  = isEven ? '#ff3333' : '#00ff88';
                resultText.style.textShadow = isEven
                    ? '0 0 15px #ff0000,0 0 30px #cc0000'
                    : '0 0 15px #00ff88,0 0 30px #00cc66';

            } else if (hpResultType === 'showall') {
                resultText.innerText = text;
                applyBallColour(resultNumCircle, n2);
                resultNumCircle.classList.add('show');
                resultColorLabel.textContent = colorStr;
                resultColorLabel.classList.add('show');
                resultColorLabel.classList.add(isEven ? 'red' : 'green');
            }
        } else {
            resultText.innerText = text;
        }

        // Adjust font size based on text length
        const txtLen = resultText.innerText.length;
        resultText.style.fontSize = txtLen <= 4 ? '34px' : txtLen <= 6 ? '26px' : '20px';

        finalResult.style.display = 'flex';
        setTimeout(() => resultText.classList.add('pop-in'), 10);
        btnExecute.style.background  = 'linear-gradient(180deg,#0088cc 0%,#004466 100%)';
        btnExecute.style.borderColor = 'rgba(0,220,255,0.6)';

        // Flash panel on every result change
        triggerPanelFlash();
    }

    /* ── ANIMATED hack sequence ── */
    let isScanning = false;
    let hackTimeoutId = null;
    let switchBlockedUntil = 0;
    function isSwitchBlocked() { return Date.now() < switchBlockedUntil; }
    function blockSwitch() { switchBlockedUntil = Date.now() + 300; }
    function triggerHackSequence(finalText, period, num) {
        isScanning = true;
        triggerBlazePop();
        triggerPanelFlash();
        if (hackTimeoutId) { clearTimeout(hackTimeoutId); hackTimeoutId = null; }
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        finalResult.style.display = 'none';
        resultText.classList.remove('pop-in');
        if (resultNumCircle) resultNumCircle.classList.remove('show');
        if (resultColorLabel) resultColorLabel.classList.remove('show');
        advancedLoader.style.display = 'flex';
        radarBox.classList.add('scanning');
        btnExecute.innerText = '...';
        btnExecute.style.background  = 'linear-gradient(180deg,#0a1828 0%,#050c14 100%)';
        btnExecute.style.borderColor = 'rgba(0,100,180,0.3)';
        loadingStatusText.innerText = 'Checking...';
        hackTimeoutId = setTimeout(() => {
            showResultDirect(finalText, num);
            isScanning = false;
            savePeriodResult(period, finalText, num);
            startCountdown();
            hackTimeoutId = null;
        }, 1500);
    }

    /* ════════════════════════════════════════════════════════
       MAIN UPDATE — WinGo 30s
    ════════════════════════════════════════════════════════ */
    let lastPeriod30s = '';
    function mainUpdate30s() {
        if (isScanning) return;
        // Period derived from current UTC time (30s slots)
        const now = new Date();
        const dateStr = now.toISOString().slice(0,10).replace(/-/g,'');
        const slot30s = Math.floor((now.getUTCHours()*3600 + now.getUTCMinutes()*60 + now.getUTCSeconds()) / 30);
        const nextPeriod = dateStr + '1000' + String(50001 + slot30s).padStart(5,'0');
        periodNumber.innerText = nextPeriod;
        if (lastPeriod30s === nextPeriod) return;
        lastPeriod30s = nextPeriod;
        const saved = loadSavedResult(nextPeriod);
        if (saved) { showResultDirect(saved.result, saved.num); startCountdown(); }
        else {
            // Generate 361 results locally, use only the 361st
            const full = pickResultFull([]);
            triggerHackSequence(full.result, nextPeriod, full.num);
        }
    }

    /* ════════════════════════════════════════════════════════
       MAIN UPDATE — WinGo 1m
    ════════════════════════════════════════════════════════ */
    let lastPeriod1m = '';
    function mainUpdate1m() {
        if (isScanning) return;
        // Period derived from current UTC time (1m slots)
        const now = new Date();
        const dateStr = now.toISOString().slice(0,10).replace(/-/g,'');
        const totalMinutes = now.getUTCHours()*60 + now.getUTCMinutes();
        const nextPeriod = dateStr + '1000' + String(10001 + totalMinutes).padStart(5,'0');
        periodNumber.innerText = nextPeriod;
        if (lastPeriod1m === nextPeriod) return;
        lastPeriod1m = nextPeriod;
        const saved = loadSavedResult(nextPeriod);
        if (saved) { showResultDirect(saved.result, saved.num); startCountdown(); }
        else {
            // Generate 361 results locally, use only the 361st
            const full = pickResultFull([]);
            triggerHackSequence(full.result, nextPeriod, full.num);
        }
    }

    /* ════════════════════════════════════════════════════════
       TRX / K3 LIVE UPDATERS (period + checking + result)
    ════════════════════════════════════════════════════════ */
    let lastPeriodTrx = '';
    let lastPeriodK3  = '';

    function computeCurrentPeriod(game, mode) {
        const now = new Date();
        const dateStr = now.toISOString().slice(0,10).replace(/-/g,'');
        const totalMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
        const is3m = mode === 'TRX3m' || mode === 'K33m';
        if (is3m) {
            const threeMinBlock = Math.floor(totalMinutes / 3);
            if (game === 'TRX') {
                return dateStr + '1020' + String(20000 + threeMinBlock + 1).padStart(5,'0');
            } else {
                // K3 3m: mid '10102' + totalMinutes padded 4
                return dateStr + '10102' + String(totalMinutes).padStart(4,'0');
            }
        } else {
            if (game === 'TRX') {
                return dateStr + '1030' + String(10001 + totalMinutes).padStart(5,'0');
            } else {
                // K3 1m: mid '101' + totalMinutes padded 4
                return dateStr + '101' + String(totalMinutes).padStart(4,'0');
            }
        }
    }

    function mainUpdateTRX() {
        if (isScanning) return;
        const modeSnap = activePanelMode;
        if (!modeSnap.startsWith('TRX')) return;
        const nextPeriod = computeCurrentPeriod('TRX', modeSnap);
        periodNumber.innerText = nextPeriod;
        if (lastPeriodTrx === nextPeriod) return;
        lastPeriodTrx = nextPeriod;
        const saved = loadSavedResult(nextPeriod);
        if (saved) { showResultDirect(saved.result, saved.num); startCountdown(); }
        else { const full = pickResultFull([]); triggerHackSequence(full.result, nextPeriod, full.num); }
    }

    function mainUpdateK3() {
        if (isScanning) return;
        const modeSnap = activePanelMode;
        if (!modeSnap.startsWith('K3')) return;
        const nextPeriod = computeCurrentPeriod('K3', modeSnap);
        periodNumber.innerText = nextPeriod;
        if (lastPeriodK3 === nextPeriod) return;
        lastPeriodK3 = nextPeriod;
        const saved = loadSavedResult(nextPeriod);
        if (saved) { showResultDirect(saved.result, saved.num); startCountdown(); }
        else { const pred = genK3Result(); triggerHackSequence(pred, nextPeriod, getResultNumber(pred)); }
    }

    /* ── Dispatch — always reset lastPeriod for target mode so it runs fresh on switch ── */
    let updateIntervalId = null;
    function startModeUpdates() {
        if (updateIntervalId) clearInterval(updateIntervalId);
        if (hackTimeoutId) { clearTimeout(hackTimeoutId); hackTimeoutId = null; isScanning = false; }
        // Clear result display on mode switch
        finalResult.style.display = 'none';
        resultText.classList.remove('pop-in');
        if (resultNumCircle)  resultNumCircle.classList.remove('show');
        if (resultColorLabel) resultColorLabel.classList.remove('show');
        if (resultNumsOnly)   { resultNumsOnly.classList.remove('show'); resultNumsOnly.innerHTML = ''; }
        periodNumber.innerText = '-----';
        if (activePanelMode === 'WinGo30s') {
            lastPeriod30s = '';
            mainUpdate30s(); updateIntervalId = setInterval(mainUpdate30s, 2000);
        } else if (activePanelMode === 'WinGo1m') {
            lastPeriod1m = '';
            mainUpdate1m(); updateIntervalId = setInterval(mainUpdate1m, 4000);
        } else if (activePanelMode.startsWith('TRX')) {
            lastPeriodTrx = '';
            mainUpdateTRX(); updateIntervalId = setInterval(mainUpdateTRX, 3000);
        } else if (activePanelMode.startsWith('K3')) {
            lastPeriodK3 = '';
            mainUpdateK3(); updateIntervalId = setInterval(mainUpdateK3, 3000);
        }
    }

    /* ════════════════════════════════════════════════════════
       HISTORY PANEL — Game/Mode/ResultType state (declared early
       so refreshPanelModes and other functions can reference them)
    ════════════════════════════════════════════════════════ */
    let hpGame       = 'WinGo';
    let hpWinGoMode  = 'WinGo1m';
    let hpTrxMode    = 'TRX1m';
    let hpK3Mode     = 'K31m';
    let hpResultType = 'showall'; // size | size+num | colour | showall | numsonly

    /* ── PANEL FLASH on new period or result switch ── */
    function triggerPanelFlash() {
        const panel = document.getElementById('main-panel');
        if (!panel) return;
        panel.classList.remove('panel-flash');
        requestAnimationFrame(function() {
            panel.classList.add('panel-flash');
            setTimeout(() => panel.classList.remove('panel-flash'), 600);
        });
    }

    /* ── BLAZE POP on mode switch ── */
    function triggerBlazePop() {
        const wings = document.querySelectorAll('.wing-wrapper-left, .wing-wrapper-right');
        wings.forEach(w => {
            w.classList.remove('blaze-pop');
            requestAnimationFrame(function() {
                w.classList.add('blaze-pop');
                setTimeout(() => w.classList.remove('blaze-pop'), 550);
            });
        });
    }

    /* ════════════════════════════════════════════════════════
       PANEL MODE BUTTONS — dynamic per game; drives history view
    ════════════════════════════════════════════════════════ */
    function refreshPanelModes() {
        const row = document.getElementById('panel-mode-row');
        if (!row) return;
        row.innerHTML = '';
        let modes, currentVal;
        if (hpGame === 'WinGo') {
            modes = [['WinGo30s','WinGo 30s'], ['WinGo1m','WinGo 1m']];
            currentVal = hpWinGoMode;
        } else if (hpGame === 'TRX') {
            modes = [['TRX1m','TRX 1m'], ['TRX3m','TRX 3m']];
            currentVal = hpTrxMode;
        } else {
            modes = [['K31m','K3 1m'], ['K33m','K3 3m']];
            currentVal = hpK3Mode;
        }
        modes.forEach(([val, label]) => {
            const b = document.createElement('button');
            b.className = 'panel-mode-btn' + (currentVal === val ? ' active' : '');
            b.dataset.pmode = val;
            b.textContent = label;
            b.addEventListener('click', () => {
                if (isSwitchBlocked()) return;
                blockSwitch();
                row.querySelectorAll('.panel-mode-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                // Update per-game state
                if (hpGame === 'WinGo') {
                    hpWinGoMode = val;
                    activePanelMode = val;
                    triggerBlazePop();
                    startModeUpdates();
                    startCountdown();
                } else if (hpGame === 'TRX') {
                    hpTrxMode = val;
                    activePanelMode = val;
                    triggerBlazePop();
                    startModeUpdates();
                    startCountdown();
                } else {
                    hpK3Mode = val;
                    activePanelMode = val;
                    triggerBlazePop();
                    startModeUpdates();
                    startCountdown();
                }
                // Sync history panel mode buttons too
                document.querySelectorAll('#hp-mode-row .hp-mode-btn').forEach(hb => {
                    hb.classList.toggle('active', hb.dataset.mode === val);
                });
                renderHistoryList();
            });
            row.appendChild(b);
        });
    }
    refreshPanelModes();

    /* ════════════════════════════════════════════════════════
       CANVAS ANIMATIONS (stars/ripples/streaks)
    ════════════════════════════════════════════════════════ */
    const starCanvas = document.getElementById('blue-stars');
    const ctx = starCanvas.getContext('2d');
    function resizeCanvas() { starCanvas.width=radarBox.clientWidth||160; starCanvas.height=radarBox.clientHeight||90; }
    setTimeout(() => { resizeCanvas(); initAll(); runLoop(0); }, 200);
    window.addEventListener('resize', resizeCanvas);

    const ripples=[];
    function spawnRipple(){ ripples.push({ x:Math.random()*starCanvas.width, y:Math.random()*starCanvas.height, r:0, maxR:Math.random()*18+10, speed:Math.random()*0.45+0.25, a:0.7 }); }
    let rippleTimer=0;
    function updateRipples(){ for(let i=ripples.length-1;i>=0;i--){ const rp=ripples[i]; rp.r+=rp.speed; rp.a=0.7*(1-rp.r/rp.maxR); if(rp.r>=rp.maxR) ripples.splice(i,1); } rippleTimer++; if(rippleTimer%55===0) spawnRipple(); if(rippleTimer%90===0) spawnRipple(); }
    function drawRipples(){ ripples.forEach(rp=>{ ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2); ctx.strokeStyle=`rgba(0,180,255,${rp.a})`; ctx.lineWidth=1; ctx.shadowBlur=8; ctx.shadowColor='#00aaff'; ctx.stroke(); if(rp.r>4){ ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r*0.55,0,Math.PI*2); ctx.strokeStyle=`rgba(100,200,255,${rp.a*0.5})`; ctx.lineWidth=0.6; ctx.shadowBlur=0; ctx.stroke(); } }); }
    const orbs=[];
    function mkOrb(){ return { x:Math.random()*starCanvas.width, y:Math.random()*starCanvas.height, r:Math.random()*2+0.8, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, a:Math.random()*0.5+0.3, phase:Math.random()*Math.PI*2, speed:Math.random()*0.04+0.02 }; }
    function initAll(){ for(let i=0;i<22;i++) orbs.push(mkOrb()); spawnRipple(); spawnRipple(); }
    function updateOrbs(){ orbs.forEach(o=>{ o.x+=o.vx; o.y+=o.vy; o.phase+=o.speed; const pulse=0.7+0.3*Math.sin(o.phase); o.curA=o.a*pulse; if(o.x<0||o.x>starCanvas.width) o.vx*=-1; if(o.y<0||o.y>starCanvas.height) o.vy*=-1; }); }
    function drawOrbs(){ orbs.forEach(o=>{ ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fillStyle=`rgba(0,180,255,${o.curA})`; ctx.shadowBlur=10; ctx.shadowColor='#00aaff'; ctx.fill(); }); }
    const streaks=[]; let streakTimer=0;
    function spawnStreak(){ const y=Math.random()*starCanvas.height; streaks.push({ x:-10, y, len:Math.random()*22+12, speed:Math.random()*2.5+1.5, a:0.7 }); }
    function updateStreaks(){ streakTimer++; if(streakTimer%70===0) spawnStreak(); for(let i=streaks.length-1;i>=0;i--){ streaks[i].x+=streaks[i].speed; streaks[i].a-=0.008; if(streaks[i].x>starCanvas.width+30||streaks[i].a<=0) streaks.splice(i,1); } }
    function drawStreaks(){ streaks.forEach(s=>{ const grad=ctx.createLinearGradient(s.x-s.len,s.y,s.x,s.y); grad.addColorStop(0,'rgba(0,180,255,0)'); grad.addColorStop(1,`rgba(150,220,255,${s.a})`); ctx.beginPath(); ctx.moveTo(s.x-s.len,s.y); ctx.lineTo(s.x,s.y); ctx.strokeStyle=grad; ctx.lineWidth=1.2; ctx.shadowBlur=6; ctx.shadowColor='#00aaff'; ctx.stroke(); }); }
    /* rAF throttled to ~30fps; paused when tab hidden — only perf change */
    let _loopLast=0;
    function runLoop(ts){ requestAnimationFrame(runLoop); if(ts-_loopLast<33||document.hidden) return; _loopLast=ts; ctx.clearRect(0,0,starCanvas.width,starCanvas.height); ctx.shadowBlur=0; updateRipples(); drawRipples(); updateOrbs(); drawOrbs(); updateStreaks(); drawStreaks(); ctx.shadowBlur=0; }

    /* ════════════════════════════════════════════════════════
       PANEL DRAG
    ════════════════════════════════════════════════════════ */
    let isDragging=false, panelMoved=false, startX, startY, initialLeft, initialTop, dragTarget=null;
    function dragStart(e) {
        isDragging=true; panelMoved=false; dragTarget=e.target;
        const cx=e.type.includes('touch')?e.touches[0].clientX:e.clientX;
        const cy=e.type.includes('touch')?e.touches[0].clientY:e.clientY;
        if (wrapper.style.left === '') {
            const rect = wrapper.getBoundingClientRect();
            wrapper.style.left = rect.left + 'px'; wrapper.style.top = rect.top + 'px';
            wrapper.style.transform = 'none';
        }
        initialLeft=parseFloat(wrapper.style.left)||0; initialTop=parseFloat(wrapper.style.top)||0;
        startX=cx; startY=cy;
    }
    function dragActive(e) {
        if(!isDragging) return;
        const cx=e.type.includes('touch')?e.touches[0].clientX:e.clientX;
        const cy=e.type.includes('touch')?e.touches[0].clientY:e.clientY;
        const dx=cx-startX, dy=cy-startY;
        if (!panelMoved && (Math.abs(dx)>4 || Math.abs(dy)>4)) panelMoved=true;
        if (panelMoved) {
            e.preventDefault();
            wrapper.style.left=(initialLeft+dx)+'px';
            wrapper.style.top=(initialTop+dy)+'px';
        }
    }
    function dragEnd() {
        if(!isDragging) return;
        isDragging=false;
        // If we actually dragged starting from a button, swallow the upcoming click
        if (panelMoved && dragTarget && dragTarget.tagName && dragTarget.tagName.toLowerCase()==='button') {
            const t = dragTarget;
            const swallow = function(ev){ ev.stopPropagation(); ev.preventDefault(); t.removeEventListener('click', swallow, true); };
            t.addEventListener('click', swallow, true);
            setTimeout(()=>{ try{ t.removeEventListener('click', swallow, true); }catch(_e){} }, 50);
        }
        dragTarget=null;
    }
    mainPanel.addEventListener('mousedown',dragStart); document.addEventListener('mousemove',dragActive); document.addEventListener('mouseup',dragEnd);
    mainPanel.addEventListener('touchstart',dragStart,{passive:false}); document.addEventListener('touchmove',dragActive,{passive:false}); document.addEventListener('touchend',dragEnd);

    /* ── HIDE panel → show the plasma-ring floating orb at panel's current position ── */
    if (miniOrb) miniOrb.style.display = 'none';   // disable the old mini-orb entirely
    function showFloatingOrb() {
        // Position orb at the centre of the current panel location
        const orbSize = 62;
        const wRect   = wrapper.getBoundingClientRect();
        const orbLeft = wRect.left + wRect.width  / 2 - orbSize / 2;
        const orbTop  = wRect.top  + wRect.height / 2 - orbSize / 2;
        // Clamp within viewport (respecting top-bar height)
        floatingOrb.style.left = Math.max(0, Math.min(window.innerWidth  - orbSize, orbLeft)) + 'px';
        floatingOrb.style.top  = Math.max(44, Math.min(window.innerHeight - orbSize - 42, orbTop)) + 'px';
        floatingOrb.dataset.userMoved = '1'; // keep it at this position
        wrapper.style.display        = 'none';
        floatingOrb.style.display    = 'flex';
    }
    function hideFloatingOrb() {
        floatingOrb.style.display = 'none';
        wrapper.style.display = 'block';
    }
    btnHide.addEventListener('click', showFloatingOrb);

    /* Floating-orb drag + tap-to-restore (5px threshold) */
    let foDrag=false, foMoved=false, foSL, foST, foX0, foY0;
    function foDragStart(e){
        foDrag=true; foMoved=false;
        const cx=e.type.includes('touch')?e.touches[0].clientX:e.clientX;
        const cy=e.type.includes('touch')?e.touches[0].clientY:e.clientY;
        foSL=parseFloat(floatingOrb.style.left)||floatingOrb.getBoundingClientRect().left;
        foST=parseFloat(floatingOrb.style.top)||floatingOrb.getBoundingClientRect().top;
        foX0=cx; foY0=cy;
    }
    function foDragActive(e){
        if(!foDrag) return;
        const cx=e.type.includes('touch')?e.touches[0].clientX:e.clientX;
        const cy=e.type.includes('touch')?e.touches[0].clientY:e.clientY;
        const dx=cx-foX0, dy=cy-foY0;
        if (Math.abs(dx)>5||Math.abs(dy)>5) foMoved=true;
        if (foMoved){
            e.preventDefault();
            floatingOrb.style.left=(foSL+dx)+'px';
            floatingOrb.style.top =(foST+dy)+'px';
            floatingOrb.dataset.userMoved = '1';
        }
    }
    function foDragEnd(){
        if(!foDrag) return;
        foDrag=false;
        if(!foMoved) hideFloatingOrb();
    }
    floatingOrb.addEventListener('mousedown',foDragStart); document.addEventListener('mousemove',foDragActive); document.addEventListener('mouseup',foDragEnd);
    floatingOrb.addEventListener('touchstart',foDragStart,{passive:false}); document.addEventListener('touchmove',foDragActive,{passive:false}); document.addEventListener('touchend',foDragEnd);

    /* ── Result type row visibility (WinGo only) ── */
    function updateResultTypeVisibility() {
        document.getElementById('hp-result-type-row').style.display = hpGame === 'WinGo' ? 'flex' : 'none';
    }

    /* ── Update history panel title to current selection ── */
    function updateHpTitle() {
        const titleEl = document.getElementById('hp-title');
        if (!titleEl) return;

                    activePanelMode = val;

        } else if (hpGame === 'TRX') {
            const modes = [['TRX1m','TRX 1m'],['TRX3m','TRX 3m']];
            modes.forEach(([val, label]) => {
                const b = document.createElement('button');
                b.className = 'hp-mode-btn' + (hpTrxMode === val ? ' active' : '');

                    b.classList.add('active');

                    startModeUpdates();
                    startCountdown();
                    // sync floating panel buttons
                    document.querySelectorAll('#panel-mode-row .panel-mode-btn').forEach(pb => {
                        pb.classList.toggle('active', pb.dataset.pmode === val);
                    });
                    renderHistoryList();
                });
                modeRow.appendChild(b);
            });
        } else if (hpGame === 'K3') {
            const modes = [['K31m','K3 1m'],['K33m','K3 3m']];
            modes.forEach(([val, label]) => {
                const b = document.createElement('button');
                b.className = 'hp-mode-btn' + (hpK3Mode === val ? ' active' : '');
                b.dataset.mode = val; b.textContent = label;
                b.addEventListener('click', () => {

        return gen361Result(() => (Math.random() < 0.5 ? 'BIG' : 'SMALL'));

        return gen361Result(() => (Math.random() < 0.5 ? 'ODD' : 'EVEN'));

        if (hpGame === 'K3')    return GAME_CFG.tag + '_k3_hist_'  + hpK3Mode;
        return GAME_CFG.tag + '_gw_hist_WinGo30s';

        // For TRX and K3, generate & store if not exists
        const key = getStorageKey();
        let hist = [];
        try { hist = JSON.parse(__LS.getItem(key) || '[]'); } catch(e) {}

            let result;
            if (hpGame === 'TRX')   result = genTrxResult();
            else if (hpGame === 'K3') result = genK3Result();

    function ensureCurrentPeriodForGame() {
        if (hpGame === 'WinGo') return;

                periodId = dateStr + '10102' + String(totalMinutes).padStart(4,'0');

            item.className = 'hp-item';
            let detailsHtml = '';
            if (hpGame === 'WinGo') {
                const n2 = typeof rec.num === 'number' ? rec.num : getResultNumber(rec.result);
                const isEven = n2 % 2 === 0;
                if (hpResultType === 'size') {
                    detailsHtml = `<span class="${rec.result === 'BIG' ? 'hp-big' : 'hp-small'}">${rec.result}</span>`;
                } else if (hpResultType === 'size+num') {
                    detailsHtml = `<span class="${rec.result === 'BIG' ? 'hp-big' : 'hp-small'}">${rec.result}</span><img class="hp-num-img" src="${n2}.png" alt="${n2}">`;
                } else if (hpResultType === 'colour') {
                    const col = isEven ? 'Red' : 'Green';
                    detailsHtml = `<span class="${isEven ? 'hp-color-red' : 'hp-color-green'}">${col}</span>`;
                } else if (hpResultType === 'showall') {
                    const col = isEven ? 'red' : 'grn';
                    const numStr = String(n2);
                    detailsHtml = `<span style="font-size:9px;font-weight:900;color:#ffffff;letter-spacing:0.3px;">`
                                + `${rec.result} ${numStr} <span style="color:${isEven ? '#ff4466' : '#00ee77'}">${isEven ? 'red' : 'grn'}</span>`
                                + `</span>`;
                } else if (hpResultType === 'numsonly') {
                    // Show only 4 plain numbers like: 6, 7, 9, 1
                    if (Array.isArray(rec.digits4) && rec.digits4.length) {
                        detailsHtml = `<span style="font-size:11px;font-weight:900;color:#00d4ff;letter-spacing:1px;">${rec.digits4.join(', ')}</span>`;
                    } else {
                        // Fallback: generate display numbers from result
                        const n2 = typeof rec.num === 'number' ? rec.num : getResultNumber(rec.result);
                        const fallbackDigits = [];
                        fallbackDigits.push(n2 % 10);
                        const extras = [1,2,3,4,5,6,7,8,9,0].filter(x => x !== n2 % 10);
                        while (fallbackDigits.length < 4) fallbackDigits.push(extras[fallbackDigits.length - 1]);
                        detailsHtml = `<span style="font-size:11px;font-weight:900;color:#00d4ff;letter-spacing:1px;">${fallbackDigits.join(', ')}</span>`;
                    }
                }
            } else if (hpGame === 'TRX') {
                detailsHtml = `<span class="${rec.result === 'BIG' ? 'hp-big' : 'hp-small'}">${rec.result}</span>`;
            } else if (hpGame === 'K3') {
                detailsHtml = `<span class="${rec.result === 'EVEN' ? 'hp-even' : 'hp-odd'}">${rec.result}</span>`;
            }
            item.innerHTML = `<span class="hp-period">${String(rec.period)}</span><div class="hp-details">${detailsHtml}</div>`;
            listEl.appendChild(item);
        });
    }

    /* ════════════════════════════════════════════════════════
       INIT
    ════════════════════════════════════════════════════════ */
    updateResultTypeVisibility();
    updateHpTitle();
    // Sync select to default hpResultType (including numsonly)
    const hpRtSelectInit = document.getElementById('hp-rt-select');
    if (hpRtSelectInit) hpRtSelectInit.value = hpResultType;
    startCountdown();
    startModeUpdates();

       REGISTER AUDIO — play only once per 20-min cooldown;
       remembers last playback time across page loads.
    ════════════════════════════════════════════════════════ */
    (function() {
        const TWENTY_MIN = 20 * 60 * 1000;
        const lastPlay = __LS.getItem('gw_register_played');
        const canPlay = !lastPlay || (Date.now() - parseInt(lastPlay, 10) > TWENTY_MIN);

                audio.play().catch(() => {});
                __LS.setItem('gw_register_played', String(Date.now()));
                document.removeEventListener('click', playOnce);
            });
        }
    })();

})();

        var SZ=140,CX=70,CY=70;
        var svg=document.createElementNS(NS,'svg');
        svg.setAttribute('width',SZ); svg.setAttribute('height',SZ);

        svg.style.cssText='position:absolute;left:50%;top:50%;margin:-70px 0 0 -70px;'
            +'width:'+SZ+'px;height:'+SZ+'px;pointer-events:none;z-index:5;overflow:visible;'
            +'animation:orbRingRotate 5s linear infinite;';
        var defs=document.createElementNS(NS,'defs');
        function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
        // conic gradient approximated via angular stops on a conicalGradient-like arc
        var rg=mk('linearGradient',{id:'plasmaArc',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
        [[0,'#00d4ff',1],[33,'#0088cc',0.85],[66,'#004488',0.5],[100,'#00d4ff',0.9]].forEach(function(s){

            +'<feComposite in="c" in2="b" operator="in" result="g"/>'
            +'<feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>';

        svg.appendChild(defs);

        var R=37, N=8;
        for(var i=0;i<N;i++){
            var a1=(i/N)*2*Math.PI - 0.25;
            var a2=a1+0.38;
            var x1=CX+R*Math.sin(a1), y1=CY-R*Math.cos(a1);
            var x2=CX+R*Math.sin(a2), y2=CY-R*Math.cos(a2);

    ════════════════════════════════════════════════════════ */
    /* Corner flames: single shared canvas, 2 corners only, capped at 30fps */
    function triggerCornerFlames() {
        const DURATION = 1500;
        const W = window.innerWidth, H = window.innerHeight;
        const corners = [
            { x: 0, y: 0,  angle: 45  },
            { x: W, y: 0,  angle: 135 },
            { x: 0, y: H,  angle: -45 },
            { x: W, y: H,  angle: -135 },
        ];
        const canvases = corners.map(c => {
            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            Object.assign(cv.style, {
                position:'fixed', top:'0', left:'0', width:'100%', height:'100%',
                pointerEvents:'none', zIndex:'99999', opacity:'1',
                transition:'opacity 0.35s ease'
            });
            document.body.appendChild(cv);
            return { cv, ctx: cv.getContext('2d'), origin: c };
        });
        const pools = canvases.map(() => []);
        function spawnParticle(pool, origin) {
            const spread = 38;
            const baseAngle = (origin.angle * Math.PI) / 180;
            const angle = baseAngle + (Math.random() - 0.5) * (spread * Math.PI / 180);
            const speed = 2.5 + Math.random() * 3.5;
            pool.push({
                x: origin.x, y: origin.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 1.0, decay: 0.018 + Math.random() * 0.022,
                size: 4 + Math.random() * 9,
                hue: 120 + Math.random() * 60
            });
        }
        const start = performance.now();
        function frame(now) {
            const elapsed = now - start;
            const spawnActive = elapsed < DURATION - 350;
            canvases.forEach(({ ctx, cv, origin }, i) => {
                ctx.clearRect(0, 0, cv.width, cv.height);
                const pool = pools[i];
                if (spawnActive) { for (let s = 0; s < 5; s++) spawnParticle(pool, origin); }
                for (let p = pool.length - 1; p >= 0; p--) {
                    const pt = pool[p];
                    pt.x += pt.vx; pt.y += pt.vy;
                    pt.vy += 0.07; pt.vx *= 0.986;
                    pt.life -= pt.decay; pt.size *= 0.977;
                    if (pt.life <= 0 || pt.size < 0.8) { pool.splice(p, 1); continue; }
                    const g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.size);
                    g.addColorStop(0,   `hsla(${pt.hue+60},100%,95%,${pt.life})`);
                    g.addColorStop(0.3, `hsla(${pt.hue+20},100%,72%,${pt.life*0.9})`);
                    g.addColorStop(0.7, `hsla(${pt.hue},   100%,52%,${pt.life*0.55})`);
                    g.addColorStop(1,   `hsla(${pt.hue-20},100%,32%,0)`);
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
                    ctx.fillStyle = g; ctx.fill();
                }
            });
            if (elapsed < DURATION + 400) {
                requestAnimationFrame(frame);
            } else {
                canvases.forEach(({ cv }) => { cv.style.opacity = '0'; });
                setTimeout(() => canvases.forEach(({ cv }) => cv.remove()), 400);
            }
        }
        requestAnimationFrame(frame);
    }

    /* ── 361-Generation Logic ──
       Always generate exactly 361 random results (indices 0-360),
       ignore results 0-360, pick and return only the 361st result.

    function gen361Result(genFn) {
        let val;
        for (let i = 0; i < 361; i++) val = genFn();
        return val; // only the 361st pick is used
    }

            return { result: k3Result, colour: k3Result === 'ODD' ? 'GREEN' : 'RED', num: getResultNumber(k3Result) };
        }

        // WinGo: generate 361 numbers, pick the 361st
        const bestNum = gen361Result(() => Math.floor(Math.random() * 10));
        const sizeResult = bestNum >= 5 ? 'BIG' : 'SMALL';
        const colResult  = bestNum % 2 === 0 ? 'RED' : 'GREEN';
        return { result: sizeResult, colour: colResult, num: bestNum };
    }
